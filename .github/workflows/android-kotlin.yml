name: Android Kotlin
on:
 push:
 branches: [master, main]
 pull_request:
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build-apk:
 name: Build debug APK
 runs-on: ubuntu-latest
 timeout-minutes: 60
 steps:
 - uses: actions/checkout@v4
 - uses: pnpm/action-setup@v4
 with:
 version: 9
 - uses: actions/setup-node@v4
 with:
 node-version: 22
 cache: pnpm
 - uses: actions/setup-java@v4
 with:
 distribution: temurin
 java-version: 17
 - uses: gradle/actions/setup-gradle@v4
 - name: Install Android SDK packages
 run: |
 set -e
 yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null || true
 /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk 'platforms;android-36' 'build-tools;36.0.0' platform-tools 'ndk;27.1.12297006' 'cmake;3.22.1'
 - name: Install npm dependencies
 run: pnpm install --frozen-lockfile
 - name: Prepare local config
 run: cp local.config.example.ts local.config.ts
 - name: Generate debug keystore
 run: keytool -genkeypair -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
 - name: Make gradlew executable
 run: chmod +x android/gradlew
 - name: Assemble debug APK
 working-directory: android
 run: ./gradlew assembleDebug --no-daemon --stacktrace
 - name: Upload APK
 uses: actions/upload-artifact@v4
 with:
 name: sanna-debug-apk
 path: android/app/build/outputs/apk/debug/*.apk
 if-no-files-found: error
